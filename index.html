<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.A.K.E.L | Tesouraria</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <main class="app">

        <section class="logo">
            <h1>Tesouraria | M.A.K.E.L</h1>
            <!-- <p>Controle Financeiro Ministerial</p> -->
            <!-- <p>Ministério Apostólico Kefas</p> -->
        </section>

        <!-- TELA DE LOGIN -->
        <section id="tela-login" class="oculto">
            <form id="form-login">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário"
                       autocomplete="username" autocapitalize="none" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha"
                       autocomplete="current-password" required>

                <button id="botao-entrar" type="submit">ENTRAR</button>
                <div id="mensagem" class="mensagem"></div>
            </form>
        </section>

        <div class="footer">
            Aplicativo Oficial | Feito Por @davicanato1 <br>
            Ministério Apostólico Kefas Lavradas ©<span id="ano-atual">2026</span> <br>
            <center> CNPJ | 56.797.417/0001-81 </center>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
        const telaLogin = document.getElementById('tela-login');
        const formLogin = document.getElementById('form-login');
        const botaoEntrar = document.getElementById('botao-entrar');
        const mensagem = document.getElementById('mensagem');

        document.getElementById('ano-atual').textContent = new Date().getFullYear();

        // Ao abrir: se já estiver logado, vai direto para o dashboard
        (async () => {
            const params = new URLSearchParams(window.location.search);

            if (params.get('erro') === 'perfil') {
                mensagem.textContent = 'Perfil não encontrado. Fale com o administrador.';
            } else {
                const { data } = await db.auth.getSession();
                if (data.session) {
                    window.location.replace(PAGINA_INICIAL);
                    return;
                }
            }

            telaLogin.classList.remove('oculto');
        })();

        formLogin.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            mensagem.textContent = '';
            botaoEntrar.disabled = true;
            botaoEntrar.textContent = 'ENTRANDO...';

            let email = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value;

            // Se digitarem só "pastores", completa para pastores@kefas.com
            if (!email.includes('@')) {
                email = email.toLowerCase() + '@kefas.com';
            }

            const { error } = await db.auth.signInWithPassword({ email: email, password: senha });

            if (error) {
                botaoEntrar.disabled = false;
                botaoEntrar.textContent = 'ENTRAR';
                mensagem.textContent = 'Usuário ou senha incorretos.';
                return;
            }

            window.location.replace(PAGINA_INICIAL);
        });
    </script>

<!-- Botão de Instalação Direta (Inicia oculto) -->
<button id="btnInstalar" class="oculto" style="margin-bottom: 20px; background: #c59b27; color: white;">
    📲 Instalar Aplicação Tesouraria Kefas
</button>
    
</body>
</html>
