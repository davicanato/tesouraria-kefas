<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membros | M.A.K.E.L Tesouraria</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#060200">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Tesouraria Kefas">
    <style>
        .chip {
            display: inline-block;
            margin: 6px 6px 0 0;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 20px;
            background: #fbf8f0;
            color: #7a5c12;
            border: 1px solid rgba(197, 155, 39, 0.25);
        }
        .bloco { border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; background: #ffffff; margin-bottom: 18px; }
    </style>
</head>
<body>
    <main class="app">

        <section class="logo"><h1>Tesouraria | M.A.K.E.L</h1></section>

        <div class="topo">
            <div>
                <div id="ola" class="ola"></div>
                <div id="selo" class="selo"></div>
            </div>
            <button id="botao-sair" class="botao-sair" type="button">SAIR</button>
        </div>
        <nav id="menu" class="menu"></nav>

        <!-- ===== SÓ ADMIN: cadastrar / editar membro ===== -->
        <div id="admin-membro" class="oculto">
            <div id="titulo-form" class="secao-titulo" style="margin-top:0">Novo membro</div>
            <form id="form-membro">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Ex.: Davi Canato">

                <label>Tags</label>
                <div id="tags-form" class="bloco"></div>

                <button id="botao-salvar" type="submit">SALVAR</button>
                <button id="botao-cancelar" type="button" class="oculto"
                        style="margin-top:10px;background:#f1f5f9;color:#475569;box-shadow:none">CANCELAR EDIÇÃO</button>
            </form>
            <div id="msg" class="mensagem"></div>
        </div>

        <!-- ===== TODOS: lista e filtros ===== -->
        <div id="contagem" class="secao-titulo">Membros</div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">
            <div>
                <label for="busca">Buscar nome</label>
                <input type="text" id="busca" placeholder="Ex.: ade">
            </div>
            <div>
                <label for="filtro-tag">Tag</label>
                <select id="filtro-tag"></select>
            </div>
        </div>

        <div id="lista" class="lista"></div>

        <!-- ===== SÓ ADMIN: gerenciar tags ===== -->
        <div id="admin-tags" class="oculto">
            <div class="secao-titulo">Gerenciar tags</div>
            <form id="form-tag" style="display:flex;gap:8px;align-items:flex-start">
                <input type="text" id="tag-nome" placeholder="Nova tag. Ex.: Louvor" style="margin-bottom:0">
                <button type="submit" style="width:auto;padding:14px 18px">ADICIONAR</button>
            </form>
            <div id="msg-tag" class="mensagem"></div>
            <div id="lista-tags" class="lista" style="margin-top:6px"></div>
        </div>

        <div class="footer">
            Aplicativo Oficial | Feito Por @davicanato1 <br>
            Ministério Apostólico Kefas Lavradas ©<span id="ano-atual">2026</span> <br>
            <center> CNPJ | 56.797.417/0001-81 </center>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script>
    (async () => {
        const sessao = await iniciarPagina('membros.html');
        if (!sessao) return;

        const ehAdmin = sessao.perfil.role === 'admin';
        const el = (id) => document.getElementById(id);
        const ordem = (a, b) => a.nome.localeCompare(b.nome, 'pt-BR');
        let membros = [];
        let tags = [];
        let idEditando = null;

        if (ehAdmin) {
            el('admin-membro').classList.remove('oculto');
            el('admin-tags').classList.remove('oculto');
        }

        function aviso(id, texto, ok) {
            el(id).style.color = ok ? '#10b981' : '#ef4444';
            el(id).textContent = texto;
        }

        function botaoPequeno(texto, cor) {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = texto;
            b.style.cssText = 'width:auto;padding:6px 12px;font-size:12px;margin-left:6px;box-shadow:none;background:' + cor;
            return b;
        }

        // ---------- Carregar dados ----------
        async function carregar() {
            const r1 = await db.from('members')
                .select('id, nome, ativo, members_tags(tag_id)').order('nome');
            const r2 = await db.from('member_tags').select('id, nome').order('nome');
            if (r1.error || r2.error) {
                aviso('msg', 'Erro ao carregar: ' + (r1.error || r2.error).message, false);
                return;
            }
            membros = r1.data.sort(ordem);
            tags = r2.data.sort(ordem);
            desenharFiltroTags();
            desenharTagsForm(marcados());
            desenharListaTags();
            desenharMembros();
        }

        // ---------- Filtro de tag (lista) ----------
        function desenharFiltroTags() {
            const sel = el('filtro-tag');
            const atual = sel.value;
            sel.innerHTML = '<option value="">Todas</option>';
            tags.forEach((t) => {
                const o = document.createElement('option');
                o.value = t.id;
                o.textContent = t.nome;
                sel.appendChild(o);
            });
            sel.value = tags.some((t) => t.id === atual) ? atual : '';
        }

        // ---------- Caixinhas de tags do formulário ----------
        function marcados() {
            const s = new Set();
            el('tags-form').querySelectorAll('input:checked').forEach((c) => s.add(c.value));
            return s;
        }

        function desenharTagsForm(selecionados) {
            const box = el('tags-form');
            box.innerHTML = '';
            if (tags.length === 0) {
                box.textContent = 'Nenhuma tag criada ainda. Crie em "Gerenciar tags", lá embaixo.';
                return;
            }
            tags.forEach((t) => {
                const rotulo = document.createElement('label');
                rotulo.style.cssText = 'display:inline-flex;align-items:center;gap:6px;margin:0 14px 10px 0;font-weight:600;cursor:pointer';
                const c = document.createElement('input');
                c.type = 'checkbox';
                c.value = t.id;
                c.checked = selecionados.has(t.id);
                c.style.cssText = 'width:auto;margin:0;padding:0;box-shadow:none';
                rotulo.appendChild(c);
                rotulo.appendChild(document.createTextNode(t.nome));
                box.appendChild(rotulo);
            });
        }

        // ---------- Lista de membros ----------
        function desenharMembros() {
            const termo = el('busca').value.trim().toLowerCase();
            const tagId = el('filtro-tag').value;
            const lista = el('lista');
            lista.innerHTML = '';

            const visiveis = membros.filter((m) => {
                if (!ehAdmin && !m.ativo) return false;
                if (termo && !m.nome.toLowerCase().includes(termo)) return false;
                if (tagId && !m.members_tags.some((x) => x.tag_id === tagId)) return false;
                return true;
            });

            // ativos primeiro, desativados no final (só o admin vê)
            visiveis.sort((a, b) => (a.ativo === b.ativo ? 0 : a.ativo ? -1 : 1));
            el('contagem').textContent = 'Membros (' + visiveis.length + ')';

            if (visiveis.length === 0) {
                lista.innerHTML = '<div class="vazio">Nenhum membro encontrado.</div>';
                return;
            }

            visiveis.forEach((m) => {
                const item = document.createElement('div');
                item.className = 'item';

                const esq = document.createElement('div');
                const nome = document.createElement('div');
                nome.className = 'desc';
                nome.textContent = m.nome + (m.ativo ? '' : ' (desativado)');
                if (!m.ativo) nome.style.color = '#94a3b8';
                esq.appendChild(nome);

                const donoDasTags = document.createElement('div');
                m.members_tags
                    .map((x) => tags.find((t) => t.id === x.tag_id))
                    .filter(Boolean)
                    .sort(ordem)
                    .forEach((t) => {
                        const c = document.createElement('span');
                        c.className = 'chip';
                        c.textContent = t.nome;
                        donoDasTags.appendChild(c);
                    });
                esq.appendChild(donoDasTags);
                item.appendChild(esq);

                if (ehAdmin) {
                    const acoes = document.createElement('div');
                    acoes.style.whiteSpace = 'nowrap';

                    const bEditar = botaoPequeno('Editar', 'var(--dourado-principal)');
                    bEditar.addEventListener('click', () => {
                        idEditando = m.id;
                        el('nome').value = m.nome;
                        desenharTagsForm(new Set(m.members_tags.map((x) => x.tag_id)));
                        el('titulo-form').textContent = 'Editando membro';
                        el('botao-salvar').textContent = 'SALVAR ALTERAÇÕES';
                        el('botao-cancelar').classList.remove('oculto');
                        el('msg').textContent = '';
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });

                    const bAtivo = botaoPequeno(m.ativo ? 'Desativar' : 'Reativar', m.ativo ? '#ef4444' : '#10b981');
                    bAtivo.addEventListener('click', async () => {
                        if (m.ativo && !confirm('Desativar "' + m.nome + '"? Ele sai das listas de escolha, mas o histórico de lançamentos continua.')) return;
                        const { error } = await db.from('members').update({ ativo: !m.ativo }).eq('id', m.id);
                        if (error) { aviso('msg', 'Erro: ' + error.message, false); return; }
                        aviso('msg', m.ativo ? 'Membro desativado.' : 'Membro reativado.', true);
                        carregar();
                    });

                    acoes.appendChild(bEditar);
                    acoes.appendChild(bAtivo);
                    item.appendChild(acoes);
                }

                lista.appendChild(item);
            });
        }

        el('busca').addEventListener('input', desenharMembros);
        el('filtro-tag').addEventListener('change', desenharMembros);

        // ---------- Salvar membro ----------
        function limparFormulario() {
            idEditando = null;
            el('nome').value = '';
            desenharTagsForm(new Set());
            el('titulo-form').textContent = 'Novo membro';
            el('botao-salvar').textContent = 'SALVAR';
            el('botao-cancelar').classList.add('oculto');
        }

        el('botao-cancelar').addEventListener('click', () => { el('msg').textContent = ''; limparFormulario(); });

        el('form-membro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = el('nome').value.trim();
            if (!nome) { aviso('msg', 'Digite o nome.', false); return; }
            const escolhidas = Array.from(marcados());

            el('botao-salvar').disabled = true;
            let membroId = idEditando;
            let erro = null;

            if (idEditando) {
                const r = await db.from('members').update({ nome: nome }).eq('id', idEditando);
                erro = r.error;
            } else {
                const r = await db.from('members').insert({ nome: nome }).select('id').single();
                erro = r.error;
                if (!erro) membroId = r.data.id;
            }

            if (!erro) {
                const r1 = await db.from('members_tags').delete().eq('member_id', membroId);
                erro = r1.error;
            }
            if (!erro && escolhidas.length > 0) {
                const linhas = escolhidas.map((t) => ({ member_id: membroId, tag_id: t }));
                const r2 = await db.from('members_tags').insert(linhas);
                erro = r2.error;
            }
            el('botao-salvar').disabled = false;

            if (erro) {
                aviso('msg', erro.code === '23505'
                    ? 'Já existe um membro com esse nome. Use o sobrenome para diferenciar.'
                    : 'Erro: ' + erro.message, false);
                return;
            }

            limparFormulario();
            aviso('msg', 'Membro salvo!', true);
            carregar();
        });

        // ---------- Gerenciar tags ----------
        function desenharListaTags() {
            const lista = el('lista-tags');
            lista.innerHTML = '';
            if (tags.length === 0) {
                lista.innerHTML = '<div class="vazio">Nenhuma tag.</div>';
                return;
            }
            tags.forEach((t) => {
                const quantos = membros.filter((m) => m.members_tags.some((x) => x.tag_id === t.id)).length;
                const item = document.createElement('div');
                item.className = 'item';

                const esq = document.createElement('div');
                const nome = document.createElement('div');
                nome.className = 'desc';
                nome.textContent = t.nome;
                const qt = document.createElement('div');
                qt.className = 'cat';
                qt.textContent = quantos + (quantos === 1 ? ' membro' : ' membros');
                esq.appendChild(nome);
                esq.appendChild(qt);

                const acoes = document.createElement('div');
                acoes.style.whiteSpace = 'nowrap';

                const bRenomear = botaoPequeno('Renomear', 'var(--dourado-principal)');
                bRenomear.addEventListener('click', async () => {
                    const novo = prompt('Novo nome da tag:', t.nome);
                    if (novo === null) return;
                    const limpo = novo.trim();
                    if (!limpo || limpo === t.nome) return;
                    const { error } = await db.from('member_tags').update({ nome: limpo }).eq('id', t.id);
                    if (error) {
                        aviso('msg-tag', error.code === '23505' ? 'Já existe uma tag com esse nome.' : 'Erro: ' + error.message, false);
                        return;
                    }
                    aviso('msg-tag', 'Tag renomeada.', true);
                    carregar();
                });

                const bExcluir = botaoPequeno('Excluir', '#ef4444');
                bExcluir.addEventListener('click', async () => {
                    if (!confirm('Excluir a tag "' + t.nome + '"? Ela será retirada dos ' + quantos + ' membro(s) que a têm. Os membros não são apagados.')) return;
                    const { error } = await db.from('member_tags').delete().eq('id', t.id);
                    if (error) { aviso('msg-tag', 'Erro: ' + error.message, false); return; }
                    aviso('msg-tag', 'Tag excluída.', true);
                    carregar();
                });

                acoes.appendChild(bRenomear);
                acoes.appendChild(bExcluir);
                item.appendChild(esq);
                item.appendChild(acoes);
                lista.appendChild(item);
            });
        }

        el('form-tag').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = el('tag-nome').value.trim();
            if (!nome) { aviso('msg-tag', 'Digite o nome da tag.', false); return; }
            const { error } = await db.from('member_tags').insert({ nome: nome });
            if (error) {
                aviso('msg-tag', error.code === '23505' ? 'Já existe uma tag com esse nome.' : 'Erro: ' + error.message, false);
                return;
            }
            el('tag-nome').value = '';
            aviso('msg-tag', 'Tag criada!', true);
            carregar();
        });

        carregar();
    })();
    </script>
</body>
</html>
